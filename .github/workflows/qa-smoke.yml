name: QA Smoke (Ollama + Qdrant)

# Optional, manual-only job for the real-service QA tests in
# `tests/requests/qa_smoke.rs`. It is skipped unless an Ollama base URL is
# supplied either as a dispatch input or as the repository variable
# `OLLAMA_BASE_URL`.
#
# The default runner is GitHub-hosted. Point `runner_label` at a self-hosted
# runner when Ollama lives on a private network (e.g. 10.124.124.3).

on:
  workflow_dispatch:
    inputs:
      ollama_base_url:
        description: "Ollama OpenAI-compatible base URL (e.g. http://10.124.124.3:11434/v1)"
        required: false
        default: ""
        type: string
      qa_model:
        description: "Chat model served by Ollama"
        required: false
        default: "qwen3.5:9b"
        type: string
      embedding_model:
        description: "Embedding model served by Ollama"
        required: false
        default: "bge-m3"
        type: string
      embedding_dimension:
        description: "Embedding vector dimension"
        required: false
        default: "1024"
        type: string
      runner_label:
        description: "Runner label (use a self-hosted runner for a private Ollama)"
        required: false
        default: "ubuntu-latest"
        type: string

concurrency:
  group: qa-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa-smoke:
    name: Real Ollama + Qdrant smoke
    if: ${{ github.event.inputs.ollama_base_url != '' || vars.OLLAMA_BASE_URL != '' }}
    runs-on: ${{ github.event.inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      OLLAMA_BASE_URL: ${{ github.event.inputs.ollama_base_url || vars.OLLAMA_BASE_URL }}
      QA_MODEL: ${{ github.event.inputs.qa_model || vars.QA_MODEL || 'qwen3.5:9b' }}
      EMBEDDING_MODEL: ${{ github.event.inputs.embedding_model || vars.EMBEDDING_MODEL || 'bge-m3' }}
      EMBEDDING_DIMENSION: ${{ github.event.inputs.embedding_dimension || vars.EMBEDDING_DIMENSION || '1024' }}
      QDRANT_IMAGE: ${{ vars.QDRANT_IMAGE || 'qdrant/qdrant:latest' }}
      LOCALSTACK_IMAGE: ${{ vars.LOCALSTACK_IMAGE || 'localstack/localstack:3' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Qdrant
        run: |
          docker run -d --name qa-smoke-qdrant \
            -p 16333:6333 -p 16334:6334 \
            "$QDRANT_IMAGE"
          for i in {1..30}; do
            if curl -fsS http://localhost:16333/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs qa-smoke-qdrant
          exit 1

      - name: Start LocalStack S3 and create the smoke bucket
        run: |
          docker run -d --name qa-smoke-localstack \
            -p 19000:4566 \
            -e SERVICES=s3 \
            -e DEBUG=0 \
            "$LOCALSTACK_IMAGE"
          for i in {1..30}; do
            if curl -fsS http://localhost:19000/_localstack/health; then
              break
            fi
            sleep 2
          done
          docker exec qa-smoke-localstack awslocal s3 mb s3://knota-fold-test-smoke

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run QA smoke tests
        env:
          KNOWLEDGE_BASE_ENABLED: "true"
          EMBEDDING_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          EMBEDDING_MODEL: ${{ env.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSION: ${{ env.EMBEDDING_DIMENSION }}
          EMBEDDING_API_KEY: ${{ secrets.OLLAMA_API_KEY || 'ollama' }}
          QA_LLM_BASE_URL: ${{ env.OLLAMA_BASE_URL }}
          QA_LLM_MODEL: ${{ env.QA_MODEL }}
          QA_LLM_API_KEY: ${{ secrets.OLLAMA_API_KEY || 'ollama' }}
          QA_LLM_PROVIDER: ollama
          QDRANT_URL: http://localhost:16334
          S3_ENDPOINT: http://localhost:19000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_TEST_BUCKET: knota-fold-test-smoke
          S3_FORCE_PATH_STYLE: "true"
          S3_REGION: us-east-1
        run: cargo test --test mod -- requests::qa_smoke --ignored --test-threads=1 --nocapture

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker logs qa-smoke-qdrant || true
          docker logs qa-smoke-localstack || true

      - name: Cleanup
        if: always()
        run: docker rm -f qa-smoke-qdrant qa-smoke-localstack || true
